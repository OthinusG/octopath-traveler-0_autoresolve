name: Validate mod

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Lua and LLVM tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4 clang llvm lld
      - name: Check Lua bootstrap
        run: |
          luac5.4 -p mod/OT0AutoResolve/Scripts/main.lua
          lua5.4 tests/test_bootstrap.lua "$GITHUB_WORKSPACE"
      - name: Check native logic
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror tests/test_logic.cpp -o /tmp/ot0-test-logic
          /tmp/ot0-test-logic
      - name: Build Windows module and packages
        run: |
          python3 -m py_compile tools/build_native.py tools/package.py
          python3 tools/package.py
